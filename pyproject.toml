[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farmnote-grass-height-prediction"
version = "0.1.0"
description = "Reproducible machine-learning experiments for FarmNote grass-height prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib==1.5.1",
  "lightgbm==4.6.0",
  "matplotlib==3.10.9",
  "numpy==2.3.1",
  "pandas==2.3.1",
  "scikit-learn==1.7.2",
  "scipy==1.16.0",
  "shap==0.48.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
